[package]
name = "pulsedeck"
version = "0.1.0"
description = "Omarchy-first display control cockpit for Hyprland monitor profiles."
authors = ["PulseDeck"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
